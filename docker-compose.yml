# Banco local alternativo (quem tem Docker). Mesma porta do scripts/dev-db.ps1, então a mesma
# TEST_DATABASE_URL e a mesma conexão de desenvolvimento servem para os dois.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ronat_dev
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ronat_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
